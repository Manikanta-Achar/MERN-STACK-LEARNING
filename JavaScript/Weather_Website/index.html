<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Weather_Website/style.css" />
    <title>Weather app</title>
  </head>
  <body>
    <div class="container">
      <div class="sub-container">
        <div class="search-input">
          <input type="text" placeholder="Search" />
          <img src="../Weather_Website/Images/search.png" />
        </div>
        <div class="weather">
          <img src="../Weather_Website/Images/drizzle.png" />
          <div class="degree">
            <p>22°C</p>
            <h1>NEW YORK</h1>
          </div>
        </div>
        <div class="humidity-wind">
          <div class="humidity">
            <img src="../Weather_Website/Images/humidity.png" />
            <div class="humidity-text">
              <h2>60%</h2>
              <p>Humidity</p>
            </div>
          </div>
          <div class="wind">
            <img src="../Weather_Website/Images/wind.png" />
            <div class="wind-text">
              <h2>18 km/h</h2>
              <p>Wind Speed</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../Weather_Website/script.js"></script>
  </body>
</html>
