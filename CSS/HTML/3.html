<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/3.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h1>Job Application<span class="sub"> (web)</span></h1>
      <form action="">
        <div class="hero">
          <div class="hearo_a">
            <label for="first-name">First Name</label>
            <input
              name="first-name"
              id="first-name"
              placeholder="Enter First Name"
            />
          </div>
          <div class="hearo_a">
            <label for="last-name">First Name</label>
            <input
              name="last-name"
              id="last-name"
              placeholder="Enter last Name"
            />
          </div>
          <div class="hearo_a">
            <label for="email">Email</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="Enter the Email"
            />
          </div>
          <div class="hearo_a">
            <label for="job-role">Job Role</label>
            <select name="job-role" id="job-role">
              <option value="">Select the Options</option>
              <option value="web">Web Developer</option>
              <option value="full">Fullstack Developer</option>
              <option value="back">Backend Developer</option>
              <option value="ui-ux">Ui-UX</option>
            </select>
          </div>
          <div class="grid-control">
            <label for="address">Address</label>
            <textarea
              name="address"
              id="address"
              rows="5"
              cols="40"
              placeholder="Enter the Address"
            ></textarea>
          </div>
          <div class="hearo_a">
            <label for="city">City</label>
            <input name="city" id="city" placeholder="Enter the City" />
          </div>
          <div class="hearo_a">
            <label for="pincode">Pincode</label>
            <input type="number" id="pincode" placeholder="Enter the Pincode" />
          </div>
          <div class="hearo_a">
            <label for="date">Date</label>
            <input type="date" id="date" value="2022-01-01" />
          </div>
          <div class="hearo_a">
            <label for="file">File</label>
            <input type="file" id="file" value="2022-01-01" />
          </div>
        </div>
        <div class="submit">
          <button class="button">Apply Now</button>
        </div>
      </form>
    </div>
  </body>
</html>
